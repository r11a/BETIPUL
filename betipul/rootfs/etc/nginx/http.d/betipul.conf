map $http_x_forwarded_proto $betipul_forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
log_format betipul_auth 'BETIPUL ingress bootstrap status=$status method=$request_method uri=$uri';
server {
  listen 8099 default_server;
  server_name _;
  allow 172.30.32.2;
  deny all;
  root /var/www/betipul;
  index index.html;
  location = /index.html {
    add_header Cache-Control "no-store" always;
    sub_filter_once on;
    sub_filter '__BETIPUL_INGRESS_PATH__' '$http_x_ingress_path';
  }
  location / { try_files $uri $uri/ /index.html; }
  location = /api/bootstrap {
    access_log /dev/stdout betipul_auth;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header X-Betipul-Ingress "true";
    proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
    proxy_set_header X-Remote-User-Display-Name $http_x_remote_user_display_name;
    proxy_set_header X-Forwarded-Proto $betipul_forwarded_proto;
  }
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header X-Betipul-Ingress "true";
    proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
    proxy_set_header X-Remote-User-Display-Name $http_x_remote_user_display_name;
    proxy_set_header X-Forwarded-Proto $betipul_forwarded_proto;
  }
  location = /health { access_log off; proxy_pass http://127.0.0.1:3000/api/health; }
}
server {
  listen 8787;
  server_name _;
  root /var/www/betipul;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header X-Betipul-Ingress "false";
    proxy_set_header X-Forwarded-Proto $betipul_forwarded_proto;
  }
  location = /health { access_log off; proxy_pass http://127.0.0.1:3000/api/health; }
}
